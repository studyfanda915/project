version: '3.9'
services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smart_converter
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: development-secret
      NEXTAUTH_URL: http://localhost:3000
      FILE_ENCRYPTION_KEY: local-dev-encryption-key
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: smart_converter
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
volumes:
  postgres-data:
